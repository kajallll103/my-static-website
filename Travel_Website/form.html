<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Enquiry Form</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-page">

    <div class="form-navbar">
        <h2 class="logo">✈ Travel Explorer</h2>

        <a href="index.html" class="back-home">
            ← Home
        </a>
    </div>

    <div class="form-container">

        <h1>Travel Enquiry Form</h1>

        <p>Tell us about your travel plans</p>

        <form id="travelForm" class="travel-form">

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="destination">Destination</label>
            <input
                type="text"
                id="destination"
                placeholder="Where do you want to travel?"
                required
            >

            <label for="message">Message</label>
            <textarea
                id="message"
                placeholder="Tell us about your travel plans"
                required
            ></textarea>

            <button type="submit" class="submit-btn">
                Submit
            </button>

        </form>

    </div>

</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbyElqj0fIdG8f-UO3Y6agNuZqkJVLYfJF8hN4nPHmz3qzjWle9kmAEtWK8oLHrGcGJG/exec";

const form = document.getElementById("travelForm");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        destination: document.getElementById("destination").value,
        message: document.getElementById("message").value
    };

    try {
        await fetch(scriptURL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(data)
        });

        alert("Thank you! Your enquiry has been submitted.");
        form.reset();

    } catch (error) {
        alert("There was an error submitting the form.");
        console.error(error);
    }
});
</script>

</body>
</html>
